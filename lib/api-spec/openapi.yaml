openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 아이템마니아 클론 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: 인증
  - name: wallet
    description: 예치금(지갑)
  - name: products
    description: 상품
  - name: orders
    description: 에스크로 주문
  - name: chat
    description: 1:1 채팅
  - name: admin
    description: 관리자
paths:
  /support/summary:
    get:
      operationId: getSupportSummary
      tags: [support]
      responses:
        '200':
          description: Own conversation unread count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportSummary' }
  /support/messages:
    get:
      operationId: getSupportMessages
      tags: [support]
      parameters:
        - { name: afterId, in: query, schema: { type: integer, minimum: 0 } }
        - { name: beforeId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Own conversation, at most 100 ascending messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportHistory' }
    post:
      operationId: sendSupportMessage
      tags: [support]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportMessageInput' }
      responses:
        '200':
          description: Persisted message, idempotent per clientId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportSendResult' }
  /support/read:
    post:
      operationId: readSupportMessages
      tags: [support]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportReadInput' }
      responses:
        '200': { description: Read watermark updated }
  /support/events:
    get:
      operationId: streamSupportEvents
      tags: [support]
      responses:
        '200': { description: Private SSE connected/support/unauthorized events }
  /admin/support/conversations:
    get:
      operationId: listSupportConversations
      tags: [support]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: beforeId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Native administrator conversation inbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportConversationPage' }
  /admin/support/{userId}:
    delete:
      operationId: removeSupportConversation
      tags: [support]
      description: Native administrator only. Permanently removes customer support messages and conversation, never trade chats or financial records. Rejects a stale last-message precondition.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportRemovalInput' }
      responses:
        '200':
          description: Conversation and messages permanently removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportRemovalResult' }
        '401': { description: Native administrator login required }
        '409': { description: New messages arrived; review conversation again }
  /admin/support/{userId}/messages:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getAdminSupportMessages
      tags: [support]
      description: Latest 100 ascending messages. Optional afterId or beforeId query cursor; only one direction per request.
      responses:
        '200':
          description: Member conversation history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportHistory' }
    post:
      operationId: sendAdminSupportMessage
      tags: [support]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportMessageInput' }
      responses:
        '200':
          description: Persisted operator reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportSendResult' }
  /admin/support/{userId}/read:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: readAdminSupportMessages
      tags: [support]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportReadInput' }
      responses:
        '200': { description: Operator read watermark updated }
  /admin/support/events:
    get:
      operationId: streamAdminSupportEvents
      tags: [support]
      responses:
        '200': { description: Native administrator SSE connected/support/unauthorized events }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: 유효성 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 이메일 중복
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password:
    post:
      operationId: changeMemberPassword
      tags: [auth]
      summary: 현재 비밀번호 확인 후 회원 비밀번호 변경 및 회원 세션 해제
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPasswordInput"
      responses:
        "200":
          description: 변경 완료, 새 비밀번호로 재로그인 필요
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPasswordChanged"
        "400":
          description: 비밀번호 확인 또는 입력 오류
        "401":
          description: 회원 로그인 필요
        "403":
          description: 관리자 계정에는 사용할 수 없음
        "409":
          description: 삭제 또는 차단된 계정

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 로그아웃
      responses:
        "200":
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: 관리자 전용 세션으로 로그인 상태 확인
      responses:
        "200":
          description: 관리자 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: 관리자 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: 내 정보 조회
      responses:
        "200":
          description: 내 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/profile:
    get:
      operationId: getMemberProfile
      tags: [auth]
      summary: 로그인한 회원 본인의 개인정보 조회
      responses:
        "200":
          description: 본인 개인정보 (캐시 금지)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "401":
          description: 회원 로그인 필요
        "403":
          description: 이용할 수 없는 계정
    patch:
      operationId: updateMemberProfile
      tags: [auth]
      summary: 회원 본인의 이름·휴대폰·계좌정보 저장
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberProfile"
      responses:
        "200":
          description: 저장된 본인 개인정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "400":
          description: 잘못된 개인정보 형식
        "401":
          description: 회원 로그인 필요
        "403":
          description: 이용할 수 없는 계정
        "409":
          description: 이미 사용 중인 휴대폰 번호

  # ─── Wallet ──────────────────────────────────────────────────────────────
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: 내 지갑 조회
      responses:
        "200":
          description: 지갑 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/charge:
    post:
      operationId: chargeWallet
      tags: [wallet]
      summary: 예치금 충전 (관리자 승인 시뮬레이션)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargeInput"
      responses:
        "200":
          description: 충전 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "400":
          description: 유효성 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/withdraw:
    post:
      operationId: requestWithdraw
      tags: [wallet]
      summary: 출금 신청
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawInput"
      responses:
        "201":
          description: 출금 신청 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRecord"
        "400":
          description: 유효성 오류 또는 잔액 부족
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Products ────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: 상품 목록
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
        - name: gameName
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 상품 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: 상품 상세
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 상품 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: 상품 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Orders ──────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: 내 주문 목록
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [buyer, seller]
      responses:
        "200":
          description: 주문 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrder
      tags: [orders]
      summary: 주문 생성 (에스크로)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: 주문 생성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: 잔액 부족 또는 유효성 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: 주문 상세
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 주문 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: 주문 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/shipped:
    patch:
      operationId: markOrderShipped
      tags: [orders]
      summary: 판매자 배송 완료 처리
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/confirm:
    patch:
      operationId: confirmOrder
      tags: [orders]
      summary: 구매자 인수확인 (판매자 대금 지급)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/cancel:
    patch:
      operationId: cancelOrder
      tags: [orders]
      summary: 주문 취소 및 환불
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelInput"
      responses:
        "200":
          description: 취소 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Chat ────────────────────────────────────────────────────────────────
  /chat/rooms:
    get:
      operationId: listChatRooms
      tags: [chat]
      summary: 내 채팅방 목록
      parameters:
        - name: includeDismissed
          in: query
          description: 마이룸 거래 조회용. 본인이 닫은 채팅도 포함하며 참여자 범위는 유지합니다.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: 채팅방 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatRoom"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/rooms/{roomId}:
    patch:
      operationId: updateChatRoom
      tags: [chat]
      summary: 채팅방 상태 변경 (인계하기/거래완료/거래취소)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRoomUpdateInput"
      responses:
        "200":
          description: 변경 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatRoomUpdateResult"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/rooms/{roomId}/dismiss:
    post:
      operationId: dismissChatRoom
      tags: [Chat]
      summary: Close this participant's chat list entry without cancelling a trade
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The room is hidden from this participant's list
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        "403":
          description: Not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/rooms/{roomId}/messages:
    get:
      operationId: getChatMessages
      tags: [chat]
      summary: 채팅 메시지 목록 및 방 정보
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 메시지 목록 및 방 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagesResponse"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: 메시지 전송
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: 전송 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin ───────────────────────────────────────────────────────────────
  /admin/registration-policy:
    get:
      operationId: adminGetRegistrationPolicy
      tags: [admin]
      summary: 신규 회원가입 차단 상태 조회
      responses:
        "200":
          description: 현재 가입 정책
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPolicy"
        "401":
          description: 관리자 로그인 필요
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 정책 조회 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: adminUpdateRegistrationPolicy
      tags: [admin]
      summary: 신규 회원가입 차단 상태 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationPolicyUpdate"
      responses:
        "200":
          description: 변경된 가입 정책
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPolicy"
        "400":
          description: blocked 값이 boolean이 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 관리자 로그인 필요
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 정책 저장 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: 전체 회원 목록
      parameters:
        - name: includeDeleted
          in: query
          schema:
            type: integer
            enum: [0, 1]
            default: 0
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: 회원 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{userId}:
    delete:
      operationId: adminRemoveMember
      tags: [admin]
      summary: 회원 비활성화 및 목록 삭제 (잔액·거래·대화 보존)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 삭제 처리 완료
          content:
            application/json:
              schema:
                type: object
                required: [ok, archived, message]
                properties:
                  ok:
                    type: boolean
                  archived:
                    type: boolean
                  message:
                    type: string
        "409":
          description: 진행 중인 거래 또는 출금
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{userId}/password-reset:
    post:
      operationId: adminResetMemberPassword
      tags: [admin]
      summary: 관리자 재인증 후 회원 임시 비밀번호 발급 (한 번만 반환, 저장하지 않음)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPasswordResetInput"
      responses:
        "200":
          description: 임시 비밀번호 발급 및 대상 회원 세션 해제
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPasswordResetResult"
        "400":
          description: 회원 본인 확인 또는 입력 오류
        "401":
          description: 관리자 로그인 필요
        "403":
          description: 권한 없음 또는 관리자 재인증 실패
        "404":
          description: 회원 없음
        "409":
          description: 삭제 또는 차단된 계정

  /admin/users/{userId}/balance:
    patch:
      operationId: adminChangeMemberBalance
      tags: [admin]
      summary: 회원 마일리지 추가 또는 최종 잔액 직접 설정
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberBalanceRequest"
      responses:
        "200":
          description: 실제 저장된 최종 잔액
          content:
            application/json:
              schema:
                type: object
                required: [balance]
                properties:
                  balance:
                    type: integer
        "400":
          description: 잘못된 금액
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 삭제된 회원
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{userId}/suspension:
    patch:
      operationId: adminSetUserSuspension
      tags: [admin]
      summary: 회원 계정 차단 또는 해제 (IP 차단과 별개)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSuspensionRequest"
      responses:
        "200":
          description: 변경된 차단 상태
          content:
            application/json:
              schema:
                type: object
                required: [id, suspendedAt]
                properties:
                  id:
                    type: integer
                  suspendedAt:
                    type: ["string", "null"]
                    format: date-time
        "403":
          description: 권한 없음 또는 관리자 차단 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin]
      summary: 전체 주문 목록
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: status
          in: query
          schema:
            type: string
        - name: includeDeleted
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: 주문 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrder"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/orders/{id}:
    delete:
      operationId: adminDeleteOrder
      tags: [admin]
      summary: 완료 또는 취소된 주문을 관리자 목록에서 삭제하고 정산 기록 보존
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 관리자 목록 삭제 완료; 실제 주문 및 연결 기록 보존
          content:
            application/json:
              schema:
                type: object
                required: [ok, preserved]
                properties:
                  ok:
                    type: boolean
                  preserved:
                    type: boolean
        "400":
          description: 잘못된 주문 ID
        "401":
          description: 관리자 세션 인증 실패
        "403":
          description: 관리자 로그인 필요
        "404":
          description: 주문 없음
        "409":
          description: 진행 중인 주문은 삭제 불가

  /admin/orders/{id}/list-entry:
    delete:
      operationId: adminHideOrder
      tags: [admin]
      summary: 삭제된 완료·취소 주문을 삭제 항목 목록에서도 제거하고 원본 기록 보존
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 목록 제거 완료; 주문·정산·대화 원본은 보존
          content:
            application/json:
              schema:
                type: object
                required: [ok, preserved]
                properties:
                  ok:
                    type: boolean
                  preserved:
                    type: boolean
        "400":
          description: 잘못된 주문 ID
        "401":
          description: 관리자 세션 인증 실패
        "403":
          description: 관리자 로그인 필요
        "404":
          description: 주문 없음
        "409":
          description: 먼저 완료 또는 취소 후 관리자 목록 삭제가 필요

  /admin/withdrawals:
    get:
      operationId: adminListWithdrawals
      tags: [admin]
      summary: 출금 신청 목록
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: 출금 신청 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WithdrawalRecord"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/products/{id}/list-entry:
    delete:
      operationId: adminHideInactiveProduct
      tags: [admin]
      summary: 비활성 상품을 관리자 목록에서만 삭제
      description: Requires an active administrator session. Inactive listings only; retain the original product, orders, chats and settlement evidence. Idempotent without changing business timestamps.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: 관리자 목록에서 제외됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InactiveProductRemovalResult"
        "400":
          description: 올바르지 않은 상품 ID
        "401":
          description: 관리자 로그인 필요
        "403":
          description: 권한 없음
        "404":
          description: 상품 없음
        "409":
          description: 비활성 상품만 목록에서 삭제 가능
  /admin/products:
    get:
      operationId: adminListProducts
      tags: [admin]
      summary: 전체 상품(판매/구매글) 목록
      responses:
        "200":
          description: 상품 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/chat-rooms:
    get:
      operationId: adminListChatRooms
      tags: [admin]
      summary: 전체 채팅 거래 내역
      parameters:
        - name: includeDeleted
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: 채팅방 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminChatRoom"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/chat-rooms/{id}:
    delete:
      operationId: adminDeleteChatRoom
      tags: [admin]
      summary: 종료된 주문 연결 채팅 또는 주문 없는 문의를 관리자 목록에서 삭제하고 메시지 보존
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 관리자 목록 삭제 완료; 대화 및 정산 기록 보존
          content:
            application/json:
              schema:
                type: object
                required: [ok, preserved]
                properties:
                  ok:
                    type: boolean
                  preserved:
                    type: boolean
        "400":
          description: 잘못된 채팅방 ID
        "401":
          description: 관리자 세션 인증 실패
        "403":
          description: 관리자 권한 없음
        "404":
          description: 채팅방 없음
        "409":
          description: 진행 중인 주문에 연결된 채팅방은 삭제 불가

  /admin/chat-rooms/{id}/list-entry:
    delete:
      operationId: adminHideChatRoom
      tags: [admin]
      summary: 삭제된 채팅거래를 관리자 목록에서 제거하고 대화·거래·정산 원본 보존
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 목록 제거 완료; 원본 기록 보존
          content:
            application/json:
              schema:
                type: object
                required: [ok, preserved]
                properties:
                  ok:
                    type: boolean
                  preserved:
                    type: boolean
        "400":
          description: 잘못된 채팅방 ID
        "401":
          description: 관리자 세션 인증 실패
        "403":
          description: 관리자 로그인 필요
        "404":
          description: 채팅방 없음
        "409":
          description: 먼저 종료 후 관리자 목록 삭제가 필요

  /admin/withdrawals/{id}:
    delete:
      operationId: adminRemoveWithdrawal
      tags: [admin]
      summary: 처리된 출금 신청을 관리자 목록에서만 삭제
      description: Active administrator session required. Pending withdrawals cannot be removed. Preserve member history, status, amounts and balances. Repeated deletion is idempotent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: 관리자 목록에서 삭제됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalListRemovalResult"
        "400":
          description: 올바르지 않은 출금 ID
        "401":
          description: 관리자 로그인 필요
        "403":
          description: 권한 없음
        "404":
          description: 출금 신청 없음
        "409":
          description: 대기 중인 출금은 삭제할 수 없음
    patch:
      operationId: adminUpdateWithdrawal
      tags: [admin]
      summary: 출금 처리 (승인/거절)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalUpdate"
      responses:
        "200":
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRecord"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    InactiveProductRemovalResult:
      type: object
      required: [ok, hidden, preserved]
      properties:
        ok:
          type: boolean
        hidden:
          type: boolean
        preserved:
          type: boolean
    WithdrawalListRemovalResult:
      type: object
      required: [ok, preserved]
      properties:
        ok:
          type: boolean
        preserved:
          type: boolean
    MemberPasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          maxLength: 128
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 16
    MemberPasswordChanged:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
    MemberPasswordResetInput:
      type: object
      required: [identityVerified, adminPassword]
      properties:
        identityVerified:
          type: boolean
          description: 관리자에 의한 회원 본인 확인 완료
        adminPassword:
          type: string
          format: password
          maxLength: 128
    MemberPasswordResetResult:
      type: object
      required: [userId, temporaryPassword]
      properties:
        userId:
          type: integer
        temporaryPassword:
          type: string
          format: password
          description: 발급 시에만 반환하는 16자 임시 비밀번호
    SupportMessageInput:
      type: object
      required: [body, clientId]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        clientId: { type: string, minLength: 1, maxLength: 80 }
        expectedUserId: { type: integer, minimum: 1, description: Optional identity-change precondition, never the owner source }
        expectedConversationId: { type: integer, minimum: 0, description: Optional first-message generation; prevents replay into a deleted conversation }
    SupportRemovalInput:
      type: object
      required: [lastMessageId]
      properties:
        lastMessageId: { type: integer, minimum: 0 }
    SupportRemovalResult:
      type: object
      required: [ok, deletedMessages]
      properties:
        ok: { type: boolean }
        deletedMessages: { type: integer }
    SupportReadInput:
      type: object
      required: [messageId]
      properties:
        messageId: { type: integer, minimum: 0 }
    SupportSummary:
      type: object
      required: [unreadCount, latestMessageId, conversationId]
      properties:
        unreadCount: { type: integer }
        latestMessageId: { type: integer }
        conversationId: { type: integer, description: First message ID of the current conversation or zero }
    SupportMessage:
      type: object
      required: [id, userId, sender, senderName, body, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        sender: { type: string, enum: [member, admin] }
        senderName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    SupportSendResult:
      type: object
      required: [message]
      properties:
        message: { $ref: '#/components/schemas/SupportMessage' }
    SupportMember:
      type: object
      required: [id, nickname, deletedAt, suspendedAt]
      properties:
        id: { type: integer }
        nickname: { type: string }
        deletedAt: { type: [string, 'null'], format: date-time }
        suspendedAt: { type: [string, 'null'], format: date-time }
    SupportHistory:
      type: object
      required: [messages, hasMore, latestMessageId, unreadCount, member, conversationId]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/SupportMessage' }
        hasMore: { type: boolean }
        latestMessageId: { type: integer }
        unreadCount: { type: integer }
        member: { $ref: '#/components/schemas/SupportMember' }
        conversationId: { type: integer }
    SupportConversation:
      type: object
      required: [userId, nickname, email, deletedAt, suspendedAt, lastMessageId, lastMessagePreview, updatedAt, unreadCount]
      properties:
        userId: { type: integer }
        nickname: { type: string }
        email: { type: string }
        deletedAt: { type: [string, 'null'], format: date-time }
        suspendedAt: { type: [string, 'null'], format: date-time }
        lastMessageId: { type: integer }
        latestMemberMessageId: { type: integer }
        lastMessagePreview: { type: string }
        updatedAt: { type: string, format: date-time }
        unreadCount: { type: integer }
    SupportConversationPage:
      type: object
      required: [conversations, hasMore, latestMemberMessageId]
      properties:
        conversations:
          type: array
          items: { $ref: '#/components/schemas/SupportConversation' }
        hasMore: { type: boolean }
        latestMemberMessageId: { type: integer }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    # ─── Auth ─────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [email, password, nickname]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        nickname:
          type: string
          minLength: 2
        phone:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, email, nickname, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        nickname:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time

    # ─── Wallet ───────────────────────────────────────────────────────────
    WalletInfo:
      type: object
      required: [id, userId, balance, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        balance:
          type: integer
        updatedAt:
          type: string
          format: date-time

    ChargeInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 1000

    WithdrawInput:
      type: object
      required: [amount, bankName, accountNumber, accountHolder]
      properties:
        amount:
          type: integer
          minimum: 1000
        bankName:
          type: string
        accountNumber:
          type: string
        accountHolder:
          type: string

    WithdrawalRecord:
      type: object
      required: [id, userId, amount, bankName, accountNumber, accountHolder, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        amount:
          type: integer
        bankName:
          type: string
        accountNumber:
          type: string
        accountHolder:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        adminNote:
          type: ["string", "null"]
        processedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    WithdrawalUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
        adminNote:
          type: ["string", "null"]

    # ─── Product ──────────────────────────────────────────────────────────
    Product:
      type: object
      required: [id, itemmaniaid, title, price, status, crawledAt]
      properties:
        id:
          type: integer
        itemmaniaid:
          type: string
        title:
          type: string
        price:
          type: integer
        category:
          type: ["string", "null"]
        gameName:
          type: ["string", "null"]
        sellerName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        quantityLabel:
          type: string
          description: 등록한 수량·범위·단위. 과거 수량이 저장되지 않은 물품은 '-'로 표시.
        thumbnailUrl:
          type: ["string", "null"]
        detailUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, sold, inactive]
        viewCount:
          type: integer
          minimum: 0
          description: 서버에 누적 저장된 상세 페이지 조회수
        crawledAt:
          type: string
          format: date-time

    ProductList:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ─── Orders ───────────────────────────────────────────────────────────
    OrderInput:
      type: object
      required: [productTitle, amount]
      properties:
        productId:
          type: ["integer", "null"]
        productTitle:
          type: string
        amount:
          type: integer
          minimum: 1
        sellerId:
          type: ["integer", "null"]

    CancelInput:
      type: object
      properties:
        reason:
          type: ["string", "null"]

    Order:
      type: object
      required: [id, buyerId, productTitle, amount, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        buyerId:
          type: integer
        sellerId:
          type: ["integer", "null"]
        productId:
          type: ["integer", "null"]
        productTitle:
          type: string
        amount:
          type: integer
        status:
          type: string
          enum: [pending, shipped, confirmed, completed, cancelled, disputed]
        cancelReason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ─── Chat ─────────────────────────────────────────────────────────────
    ChatRoom:
      type: object
      required: [id, buyerId, sellerId, createdAt]
      properties:
        id:
          type: integer
        orderId:
          type: ["integer", "null"]
        buyerId:
          type: integer
        sellerId:
          type: integer
        createdAt:
          type: string
          format: date-time

    ChatRoomDetail:
      type: object
      required: [id, buyerId, sellerId, status, buyerNickname, sellerNickname, createdAt, tradeInfo]
      properties:
        id:
          type: integer
        orderId:
          type: ["integer", "null"]
        orderCreatedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        tradeInfo:
          type: string
        buyerId:
          type: integer
        sellerId:
          type: integer
        productId:
          type: ["integer", "null"]
        status:
          type: string
        productTitle:
          type: ["string", "null"]
        productPrice:
          type: ["integer", "null"]
        productCreatedAt:
          type: ["string", "null"]
          format: date-time
        productItemmaniaId:
          type: ["string", "null"]
        productItemCategory:
          type: ["string", "null"]
        productDescription:
          type: ["string", "null"]
        productCategory:
          type: ["string", "null"]
        characterName:
          type: ["string", "null"]
        buyerCharacterName:
          type: ["string", "null"]
        sellerCharacterName:
          type: ["string", "null"]
        goodsType:
          type: ["string", "null"]
        buyerNickname:
          type: string
        sellerNickname:
          type: string
        buyerName:
          type: ["string", "null"]
        buyerPhone:
          type: ["string", "null"]
        sellerName:
          type: ["string", "null"]
        sellerPhone:
          type: ["string", "null"]
        buyerGrade:
          type: ["string", "null"]
        sellerGrade:
          type: ["string", "null"]
        buyerCreditScore:
          type: ["integer", "null"]
        sellerCreditScore:
          type: ["integer", "null"]
        buyerAuthStates:
          type: ["object", "null"]
          additionalProperties:
            type: boolean
        sellerAuthStates:
          type: ["object", "null"]
          additionalProperties:
            type: boolean
        gameName:
          type: ["string", "null"]
        serverName:
          type: ["string", "null"]
        itemCategory:
          type: ["string", "null"]

    ChatMessagesResponse:
      type: object
      required: [room, messages]
      properties:
        room:
          $ref: "#/components/schemas/ChatRoomDetail"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    ChatRoomUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, active, handover, ended, cancelled, rejected]

    ChatRoomUpdateResult:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
        status:
          type: string

    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    ChatMessage:
      type: object
      required: [id, roomId, senderId, content, createdAt]
      properties:
        id:
          type: integer
        roomId:
          type: integer
        senderId:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    AdminProduct:
      type: object
      required: [id, title, price, status, createdAt]
      properties:
        id:
          type: integer
        itemmaniaid:
          type: ["string", "null"]
        title:
          type: string
        price:
          type: integer
        category:
          type: ["string", "null"]
        gameName:
          type: ["string", "null"]
        sellerName:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, sold, inactive]
        createdAt:
          type: string
          format: date-time

    AdminOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [canDelete, canHide, adminDeletedAt, adminDeletedBy]
          properties:
            canDelete:
              type: boolean
            canHide:
              type: boolean
              description: 이미 삭제된 완료·취소 주문을 삭제 항목 목록에서도 제거할 수 있는지 여부
            adminDeletedAt:
              type: ["string", "null"]
              format: date-time
            adminDeletedBy:
              type: ["string", "null"]

    AdminChatRoom:
      type: object
      required: [id, canDelete, canHide, sellerId, buyerId, status, createdAt]
      properties:
        id:
          type: integer
        canDelete:
          type: boolean
          description: 종료된 주문 연결 거래 또는 주문 없는 문의로 관리자 목록 삭제가 가능한지 여부
        canHide:
          type: boolean
          description: 이미 삭제된 거래를 삭제 항목 포함 목록에서도 제거할 수 있는지 여부
        orderId:
          type: ["integer", "null"]
        adminDeletedAt:
          type: ["string", "null"]
          format: date-time
        adminDeletedBy:
          type: ["string", "null"]
        sellerId:
          type: integer
        buyerId:
          type: integer
        sellerNickname:
          type: ["string", "null"]
        buyerNickname:
          type: ["string", "null"]
        productTitle:
          type: ["string", "null"]
        amount:
          type: ["integer", "null"]
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    # ─── Admin ────────────────────────────────────────────────────────────
    MemberProfile:
      type: object
      additionalProperties: false
      required: [name, phone, bankName, bankAccountNumber, bankAccountHolder]
      properties:
        name:
          type: ["string", "null"]
          maxLength: 50
        phone:
          type: ["string", "null"]
          maxLength: 30
        bankName:
          type: ["string", "null"]
          maxLength: 40
        bankAccountNumber:
          type: ["string", "null"]
          maxLength: 40
        bankAccountHolder:
          type: ["string", "null"]
          maxLength: 50

    RegistrationPolicy:
      type: object
      required: [blocked]
      properties:
        blocked:
          type: boolean
    RegistrationPolicyUpdate:
      type: object
      required: [blocked]
      properties:
        blocked:
          type: boolean

    AdminUser:
      type: object
      required: [id, email, nickname, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        nickname:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [user, admin]
        signupIp:
          type: ["string", "null"]
        lastLoginIp:
          type: ["string", "null"]
        suspendedAt:
          type: ["string", "null"]
          format: date-time
        deletedAt:
          type: ["string", "null"]
          format: date-time
        balance:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
    MemberBalanceRequest:
      type: object
      required: [amount, mode]
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        mode:
          type: string
          enum: [add, set]
    AdminSuspensionRequest:
      type: object
      required: [suspended]
      properties:
        suspended:
          type: boolean
