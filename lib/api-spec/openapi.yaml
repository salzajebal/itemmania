openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 아이템마니아 클론 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: 인증
  - name: wallet
    description: 예치금(지갑)
  - name: products
    description: 상품
  - name: orders
    description: 에스크로 주문
  - name: chat
    description: 1:1 채팅
  - name: admin
    description: 관리자
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: 유효성 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 이메일 중복
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 로그아웃
      responses:
        "200":
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: 내 정보 조회
      responses:
        "200":
          description: 내 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Wallet ──────────────────────────────────────────────────────────────
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: 내 지갑 조회
      responses:
        "200":
          description: 지갑 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/charge:
    post:
      operationId: chargeWallet
      tags: [wallet]
      summary: 예치금 충전 (관리자 승인 시뮬레이션)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargeInput"
      responses:
        "200":
          description: 충전 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "400":
          description: 유효성 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/withdraw:
    post:
      operationId: requestWithdraw
      tags: [wallet]
      summary: 출금 신청
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawInput"
      responses:
        "201":
          description: 출금 신청 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRecord"
        "400":
          description: 유효성 오류 또는 잔액 부족
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Products ────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: 상품 목록
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
        - name: gameName
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 상품 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: 상품 상세
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 상품 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: 상품 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Orders ──────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: 내 주문 목록
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [buyer, seller]
      responses:
        "200":
          description: 주문 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrder
      tags: [orders]
      summary: 주문 생성 (에스크로)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: 주문 생성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: 잔액 부족 또는 유효성 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: 주문 상세
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 주문 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: 주문 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/shipped:
    patch:
      operationId: markOrderShipped
      tags: [orders]
      summary: 판매자 배송 완료 처리
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/confirm:
    patch:
      operationId: confirmOrder
      tags: [orders]
      summary: 구매자 인수확인 (판매자 대금 지급)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/cancel:
    patch:
      operationId: cancelOrder
      tags: [orders]
      summary: 주문 취소 및 환불
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelInput"
      responses:
        "200":
          description: 취소 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Chat ────────────────────────────────────────────────────────────────
  /chat/rooms:
    get:
      operationId: listChatRooms
      tags: [chat]
      summary: 내 채팅방 목록
      responses:
        "200":
          description: 채팅방 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatRoom"
        "401":
          description: 미인증
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/rooms/{roomId}:
    patch:
      operationId: updateChatRoom
      tags: [chat]
      summary: 채팅방 상태 변경 (인계하기/거래완료/거래취소)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRoomUpdateInput"
      responses:
        "200":
          description: 변경 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatRoomUpdateResult"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/rooms/{roomId}/messages:
    get:
      operationId: getChatMessages
      tags: [chat]
      summary: 채팅 메시지 목록 및 방 정보
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 메시지 목록 및 방 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagesResponse"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: 메시지 전송
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: 전송 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin ───────────────────────────────────────────────────────────────
  /admin/registration-policy:
    get:
      operationId: adminGetRegistrationPolicy
      tags: [admin]
      summary: 신규 회원가입 차단 상태 조회
      responses:
        "200":
          description: 현재 가입 정책
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPolicy"
        "401":
          description: 관리자 로그인 필요
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 정책 조회 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: adminUpdateRegistrationPolicy
      tags: [admin]
      summary: 신규 회원가입 차단 상태 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationPolicyUpdate"
      responses:
        "200":
          description: 변경된 가입 정책
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPolicy"
        "400":
          description: blocked 값이 boolean이 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 관리자 로그인 필요
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 정책 저장 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: 전체 회원 목록
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: 회원 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{userId}/suspension:
    patch:
      operationId: adminSetUserSuspension
      tags: [admin]
      summary: 회원 계정 차단 또는 해제 (IP 차단과 별개)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSuspensionRequest"
      responses:
        "200":
          description: 변경된 차단 상태
          content:
            application/json:
              schema:
                type: object
                required: [id, suspendedAt]
                properties:
                  id:
                    type: integer
                  suspendedAt:
                    type: ["string", "null"]
                    format: date-time
        "403":
          description: 권한 없음 또는 관리자 차단 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin]
      summary: 전체 주문 목록
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 주문 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/withdrawals:
    get:
      operationId: adminListWithdrawals
      tags: [admin]
      summary: 출금 신청 목록
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: 출금 신청 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WithdrawalRecord"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/products:
    get:
      operationId: adminListProducts
      tags: [admin]
      summary: 전체 상품(판매/구매글) 목록
      responses:
        "200":
          description: 상품 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/chat-rooms:
    get:
      operationId: adminListChatRooms
      tags: [admin]
      summary: 전체 채팅 거래 내역
      responses:
        "200":
          description: 채팅방 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminChatRoom"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/chat-rooms/{id}:
    delete:
      operationId: adminDeleteChatRoom
      tags: [admin]
      summary: 주문에 연결되지 않은 채팅방과 메시지 영구 삭제
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 삭제 완료
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: 잘못된 채팅방 ID
        "403":
          description: 관리자 권한 없음
        "404":
          description: 채팅방 없음
        "409":
          description: 주문에 연결된 채팅방은 삭제 불가

  /admin/withdrawals/{id}:
    patch:
      operationId: adminUpdateWithdrawal
      tags: [admin]
      summary: 출금 처리 (승인/거절)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalUpdate"
      responses:
        "200":
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRecord"
        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    # ─── Auth ─────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [email, password, nickname]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        nickname:
          type: string
          minLength: 2
        phone:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, email, nickname, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        nickname:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time

    # ─── Wallet ───────────────────────────────────────────────────────────
    WalletInfo:
      type: object
      required: [id, userId, balance, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        balance:
          type: integer
        updatedAt:
          type: string
          format: date-time

    ChargeInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 1000

    WithdrawInput:
      type: object
      required: [amount, bankName, accountNumber, accountHolder]
      properties:
        amount:
          type: integer
          minimum: 1000
        bankName:
          type: string
        accountNumber:
          type: string
        accountHolder:
          type: string

    WithdrawalRecord:
      type: object
      required: [id, userId, amount, bankName, accountNumber, accountHolder, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        amount:
          type: integer
        bankName:
          type: string
        accountNumber:
          type: string
        accountHolder:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        adminNote:
          type: ["string", "null"]
        processedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    WithdrawalUpdate:
      type: object
      required: [status]
      properties:
        status:
